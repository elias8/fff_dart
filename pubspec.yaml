name: fff_dart
description: Dart FFI bindings for FFF file indexing, fuzzy search, content grep, and filesystem watching.
version: 0.1.0
homepage: https://github.com/elias8/fff_dart
repository: https://github.com/elias8/fff_dart
issue_tracker: https://github.com/elias8/fff_dart/issues

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.4

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0

dev_dependencies:
  ffigen: ^22.0.0
  lints: ^6.0.0
  logging: ^1.3.0
  test: ^1.32.0
